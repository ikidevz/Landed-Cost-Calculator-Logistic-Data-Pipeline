version: 2

# ─────────────────────────────────────────────────────────────────────────────
# SOURCE: staging.raw_shipments
# Written by: consumer.py (Kafka consumer)
# Refreshed: continuously (streaming ingestion)
# ─────────────────────────────────────────────────────────────────────────────

sources:
  - name: staging
    database: landed_cost_db
    schema: staging
    description: >
      Raw shipment records inserted by the Kafka consumer (consumer.py).
      One row per shipment event. No transformations applied — this is the
      source of truth for replay and reprocessing.
    tables:
      - name: raw_shipments
        description: "Raw Kafka consumer output — one row per shipment event"
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
        loaded_at_field: consumed_at
        columns:
          - name: shipment_id
            description: "UUID primary key — generated by the synthetic data generator"
            tests:
              - unique
              - not_null
          - name: shipment_date
            description: "Date of shipment (from source system)"
            tests:
              - not_null
          - name: hs_code
            description: "8-digit AHTN/HS code identifying the commodity"
            tests:
              - not_null
          - name: port_of_discharge
            description: "Philippine port where goods are unloaded"
            tests:
              - not_null
              - accepted_values:
                  values:
                    - "Manila"
                    - "Cebu"
                    - "Davao"
                    - "Subic Bay"
                    - "Batangas"
                    - "Cagayan de Oro"
                    - "Iloilo"
                    - "General Santos"
                    - "Zamboanga"
                    - "Clark"
          - name: cif_value_usd
            description: "Cost + Insurance + Freight value in USD — the dutiable base"
            tests:
              - not_null
          - name: consumed_at
            description: "Timestamp when the Kafka consumer wrote this record to Postgres"
            tests:
              - not_null
